# -- Congo Theme Options --
# https://jpanther.github.io/congo/docs/configuration/#theme-parameters

colorScheme = "ocean"
defaultAppearance = "light"       # light or dark
autoSwitchAppearance = true       # follow the visitor's OS preference

defaultThemeColor = "#1d2433"

enableSearch = true
enableCodeCopy = true             # copy button on code blocks
enableImageLazyLoading = true
enableImageWebp = true

fingerprintAlgorithm = "sha256"

[header]
  layout = "hybrid"               # horizontal nav on desktop, hamburger on mobile
  showTitle = true

[footer]
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true   # manual light/dark toggle
  showScrollToTop = true

[homepage]
  layout = "page"                 # content left; the profile lives in the sidebar
  showRecent = true               # show latest posts on the home page
  showRecentItems = 5
  recentLimit = 5
  cardView = true

[article]
  showDate = true
  showDateUpdated = true
  showAuthor = true
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true      # auto TOC like the reference site
  showTaxonomies = true           # tag chips
  showWordCount = false
  showComments = false
  sharingLinks = ["linkedin", "x-twitter", "reddit", "email"]

[list]
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  showTaxonomies = true
  groupByYear = true
  cardView = true
  cardViewScreenWidth = false
  paginationWidth = 1

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
